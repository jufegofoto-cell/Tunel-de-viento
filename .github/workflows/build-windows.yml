name: Build Windows

# Compila Tunel de Viento para Windows x64 y publica el .exe en un RELEASE
# (evita el limite de almacenamiento de artefactos del plan gratuito).
#  - Ejecucion manual (Run workflow): actualiza el release "latest".
#  - Empujar una etiqueta vX.Y.Z: crea un release con esa version.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # El HTML es el producto: si falta o pierde su autocontencion, el .exe
      # se compila igual pero arranca roto. Se verifica antes de gastar 5 min
      # de compilacion.
      - name: Verificar el HTML autocontenido
        shell: pwsh
        run: |
          $f = 'Tunel_de_viento_completo.html'
          if (-not (Test-Path $f)) { throw "Falta $f" }
          $t = Get-Content $f -Raw
          if ($t.Length -lt 150000) { throw "El HTML pesa $($t.Length) bytes: parece la version antigua o sin fuentes" }
          if ($t -match 'src="http|href="http|@import') { throw "El HTML tiene dependencias de red: no funcionaria sin conexion" }
          if (([regex]::Matches($t,'@font-face')).Count -ne 3) { throw "Faltan las fuentes incrustadas" }
          foreach ($m in 'multigrid','MUSCL','Smagorinsky','domSel','tipbox') {
            if ($t -notmatch $m) { throw "El HTML no contiene '$m': no es la version 2" }
          }
          Write-Host "HTML verificado: $($t.Length) bytes, autocontenido, version 2"

      # La version aparece en tres sitios: package.json (titulo de la ventana y
      # nombre de los .exe), APP_VERSION en el HTML (cabecera, pie del PNG) y la
      # etiqueta de git. Si no coinciden, el release sale con nombres cruzados.
      - name: Verificar la coherencia de la version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $t = Get-Content 'Tunel_de_viento_completo.html' -Raw
          $m = [regex]::Match($t, "const APP_VERSION = '([0-9.]+)'")
          if (-not $m.Success) { throw "El HTML no define APP_VERSION" }
          $html = $m.Groups[1].Value
          if (-not ($pkg -eq $html -or $pkg.StartsWith("$html."))) {
            throw "package.json dice $pkg y el HTML dice $html: actualizar ambos"
          }
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$pkg") {
            throw "La etiqueta ${{ github.ref_name }} no coincide con package.json ($pkg): se esperaba v$pkg"
          }
          Write-Host "Version coherente: package.json $pkg, HTML $html"

      # El icono se necesita al final del build (portable + NSIS). Sin esta
      # comprobacion el fallo aparece despues de descargar Electron, NSIS y
      # 7zip y de compilar los dos objetivos: varios minutos tirados.
      - name: Verificar los iconos
        shell: pwsh
        run: |
          $ico = 'build/icon.ico'
          $png = 'src/icon.png'
          if (-not (Test-Path $ico)) {
            throw "Falta $ico. El .ico va en la carpeta build/ del repositorio (crearla si no existe), no en la raiz."
          }
          if (-not (Test-Path $png)) { throw "Falta $png" }
          $b = [System.IO.File]::ReadAllBytes($ico)
          if ($b.Length -lt 20000) { throw "$ico pesa $($b.Length) bytes: parece corrupto (subido como texto en vez de binario)" }
          if ($b[0] -ne 0 -or $b[1] -ne 0 -or $b[2] -ne 1 -or $b[3] -ne 0) { throw "$ico no tiene cabecera ICO valida" }
          $n = [BitConverter]::ToUInt16($b, 4)
          $tam = @()
          for ($i = 0; $i -lt $n; $i++) {
            $o = 6 + $i * 16
            $w = $b[$o]; if ($w -eq 0) { $w = 256 }
            $tam += $w
          }
          if ($tam -notcontains 256) { throw "$ico no incluye la entrada de 256 px que exige electron-builder" }
          Write-Host "Iconos verificados: $ico con $n entradas ($($tam -join ', ') px)"

      - name: Install dependencies
        run: npm install
      # npm run dist lleva --publish never: el release lo sube el paso
      # siguiente, no electron-builder. Por eso aqui no hace falta GH_TOKEN.
      - name: Build portable + installer (x64)
        run: npm run dist
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Última compilación (latest)' }}
          files: dist/*.exe
          fail_on_unmatched_files: true
          body: |
            **Túnel de Viento 2.1** — simulación CFD 2D para análisis bioclimático.
            Universidad de San Buenaventura · Pasto.

            Dos descargas: `portable` (un solo .exe, no instala nada) y `setup` (instalador con acceso directo).
            No requiere WebView2 ni ningún runtime: Electron incluye su propio Chromium.

            ### Novedades frente a la 2.0
            - **Corrección en bordes abiertos.** Los modos «Planta en terreno abierto» y «Sección con suelo» usan ahora los 10 ciclos de multigrid previstos. La 2.0 forzaba 4 en todos los casos y la presión quedaba mal resuelta, con oscilaciones que no eran físicas.
            - **Geometría independiente de la malla.** Lo dibujado o importado se guarda aparte a 1920×1120 px y cada malla se deriva de ello. En la 2.0, bajar a una malla ligera y volver a subir perdía para siempre los tabiques más finos que una celda; ahora la ida y vuelta es exacta y, en malla gruesa, tabiques y vanos finos se conservan con ancho de una celda.
            - **Controles de simulación.** «Iniciar» pasa a «Reiniciar» cuando hay una simulación (vuelve el flujo a cero y conserva la geometría); «Pausar» alterna con «Reanudar»; «Resetear» borra geometría, flujo y lienzo, y conserva los parámetros. En la 2.0, «Reiniciar» solo redistribuía las partículas.
            - **Pincel en píxeles** (1 a 256 px) con su equivalencia en celdas de la malla: una imagen importada no trae escala, así que el metro era una cifra arbitraria.
            - **Duración de estela ajustable** de 0,2 a 2 s, con el número de partículas ajustado para que el coste de dibujo no cambie.
            - **Rendimiento e interfaz.** Panel a 5 Hz, escala de color solo para el campo visible, máscaras precalculadas de caras sólidas, lienzo acelerado por GPU y partículas sin asignaciones de memoria. El contador de FPS de la 2.0 contaba pasos de cálculo; ahora se muestran por separado fotogramas, pasos por segundo y milisegundos por bloque. Los interruptores del panel, que no respondían al clic, funcionan.
            - **Exportación PNG** sin barra de escala ni dimensiones del dominio, coherente con la escala nominal de las geometrías importadas.
            - «Acerca de» actualizado: efecto chimenea ausente (no hay flotabilidad), alcance real del modo sección y escala nominal.

            Los resultados son **cualitativos**: sirven para intuición, docencia y comparación temprana, no para dimensionamiento. El alcance y las restricciones están detallados en «Acerca de» dentro de la aplicación.
